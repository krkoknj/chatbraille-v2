spring:
  # DataSource ??
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:chatbraille;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  # JPA ??
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  # H2 ?? ?? (???)
  h2:
    console:
      enabled: true
      path: /h2-console